<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0022"/>
      <stop offset="45%" stop-color="#37003C"/>
      <stop offset="100%" stop-color="#0E0010"/>
    </linearGradient>
    <linearGradient id="pitchGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#37003C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lightBeam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lightBeam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#00FF87" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="stadiumCenter" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#37003C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1F0022" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Stadium Center Glow -->
  <ellipse cx="600" cy="380" rx="550" ry="180" fill="url(#stadiumCenter)"/>

  <!-- Floodlight Beams -->
  <polygon points="120,0 20,400 450,400" fill="url(#lightBeam1)"/>
  <polygon points="1080,0 750,400 1180,400" fill="url(#lightBeam2)"/>
  <polygon points="280,0 200,400 620,400" fill="url(#lightBeam1)" opacity="0.6"/>
  <polygon points="920,0 580,400 1000,400" fill="url(#lightBeam2)" opacity="0.6"/>

  <!-- Stadium Roof Canopy Silhouette -->
  <path d="M0,0 L1200,0 L1200,80 Q900,40 600,45 Q300,40 0,80 Z" fill="#140018" opacity="0.85"/>
  <path d="M0,80 Q300,40 600,45 Q900,40 1200,80" stroke="#00D9FF" stroke-width="2" stroke-opacity="0.35" fill="none"/>

  <!-- Stadium Seating Tiers Outline -->
  <path d="M0,280 Q300,220 600,220 Q900,220 1200,280 L1200,400 L0,400 Z" fill="#1A0320" opacity="0.9"/>
  <path d="M0,320 Q300,260 600,260 Q900,260 1200,320" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" fill="none"/>
  <path d="M0,350 Q300,295 600,295 Q900,295 1200,350" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.06" fill="none"/>

  <!-- Pitch Level Floor & Glow -->
  <ellipse cx="600" cy="400" rx="520" ry="120" fill="url(#pitchGlow)"/>
  <ellipse cx="600" cy="400" rx="520" ry="120" stroke="#00FF87" stroke-width="2" stroke-opacity="0.4" fill="none"/>
  <line x1="600" y1="280" x2="600" y2="400" stroke="#00FF87" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="600" cy="340" r="45" stroke="#00FF87" stroke-width="2" stroke-opacity="0.4" fill="none"/>

  <!-- Floating Star & Particle Accents -->
  <circle cx="120" cy="30" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="280" cy="20" r="3.5" fill="#00D9FF" opacity="0.9"/>
  <circle cx="920" cy="20" r="3.5" fill="#00FF87" opacity="0.9"/>
  <circle cx="1080" cy="30" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="600" cy="110" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="450" cy="140" r="2" fill="#00D9FF" opacity="0.6"/>
  <circle cx="750" cy="135" r="2" fill="#00FF87" opacity="0.6"/>
  <circle cx="340" cy="200" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="860" cy="190" r="1.5" fill="#FFFFFF" opacity="0.5"/>
</svg>
