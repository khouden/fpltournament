<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="grassMowed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#072B15"/>
      <stop offset="10%" stop-color="#0D4422"/>
      <stop offset="20%" stop-color="#083017"/>
      <stop offset="30%" stop-color="#0E4824"/>
      <stop offset="40%" stop-color="#083017"/>
      <stop offset="50%" stop-color="#0F5027"/>
      <stop offset="60%" stop-color="#083017"/>
      <stop offset="70%" stop-color="#0E4824"/>
      <stop offset="80%" stop-color="#083017"/>
      <stop offset="90%" stop-color="#0D4422"/>
      <stop offset="100%" stop-color="#072B15"/>
    </linearGradient>
    <radialGradient id="pitchCenterGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#083017" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="vignetteH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120117" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#120117" stop-opacity="0"/>
      <stop offset="80%" stop-color="#120117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#120117" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Grass Base Mowed Stripes -->
  <rect width="1200" height="400" fill="url(#grassMowed)"/>

  <!-- Radial Lighting Overlay -->
  <rect width="1200" height="400" fill="url(#pitchCenterGlow)"/>

  <!-- Pitch Chalk Markings -->
  <!-- Boundary Line -->
  <rect x="40" y="25" width="1120" height="350" rx="4" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>

  <!-- Halfway Line -->
  <line x1="600" y1="25" x2="600" y2="375" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- Center Circle & Spot -->
  <circle cx="600" cy="200" r="90" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
  <circle cx="600" cy="200" r="4" fill="#FFFFFF" opacity="0.6"/>

  <!-- Left Penalty Area -->
  <rect x="40" y="90" width="160" height="220" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <rect x="40" y="140" width="60" height="120" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <path d="M200,160 A50,50 0 0,1 200,240" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <circle cx="150" cy="200" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- Right Penalty Area -->
  <rect x="1000" y="90" width="160" height="220" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <rect x="1100" y="140" width="60" height="120" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <path d="M1000,160 A50,50 0 0,0 1000,240" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <circle cx="1050" cy="200" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- Top / Bottom Edge Vignette for contrast -->
  <rect width="1200" height="400" fill="url(#vignetteH)"/>
</svg>
