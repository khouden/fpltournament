<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fplGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00D9FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fplGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E7FF00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#37003C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glowing background circles -->
  <circle cx="340" cy="300" r="240" fill="url(#fplGlow1)" />
  <circle cx="180" cy="420" r="160" fill="url(#fplGlow2)" />

  <!-- Abstract Tactical Pitch Lines -->
  <g opacity="0.3" stroke="#37003C" stroke-width="1.5">
    <!-- Pitch boundary box -->
    <rect x="80" y="80" width="440" height="440" rx="20" stroke-dasharray="6 6" />
    <!-- Center circle -->
    <circle cx="300" cy="300" r="80" />
    <circle cx="300" cy="300" r="4" fill="#37003C" />
    <!-- Penalty arc -->
    <path d="M 220 80 C 240 130, 360 130, 380 80" />
    <path d="M 220 520 C 240 470, 360 470, 380 520" />
  </g>

  <!-- Knockout Bracket Lines -->
  <g opacity="0.4" stroke="#37003C" stroke-width="2">
    <!-- Round 1 to QF -->
    <path d="M 60 160 H 120 V 220 H 180" />
    <path d="M 60 280 H 120 V 220" />
    <!-- Round 2 to SF -->
    <path d="M 180 220 H 220 V 300 H 260" stroke="#00FF87" stroke-width="2.5" />
    
    <!-- Right side brackets -->
    <path d="M 540 160 H 480 V 220 H 420" />
    <path d="M 540 280 H 480 V 220" />
    <path d="M 420 220 H 380 V 300 H 340" stroke="#00D9FF" stroke-width="2.5" />
  </g>

  <!-- Floating Match Badge Card 1 -->
  <g transform="translate(60, 340)" filter="drop-shadow(0px 8px 16px rgba(55,0,60,0.12))">
    <rect width="170" height="60" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#00FF87" />
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#37003C">GAMEWEEK 28</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#1F1F1F">74 <tspan fill="#777777" font-weight="500">vs</tspan> 68</text>
    <circle cx="145" cy="30" r="10" fill="#00FF87" fill-opacity="0.2" />
    <path d="M 141 30 L 144 33 L 150 27" stroke="#008744" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Match Badge Card 2 -->
  <g transform="translate(370, 110)" filter="drop-shadow(0px 8px 16px rgba(55,0,60,0.12))">
    <rect width="170" height="60" rx="10" fill="#37003C" stroke="#5A0A63" stroke-width="1" />
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#E7FF00" />
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#E7FF00" letter-spacing="0.5">KNOCKOUT FINAL</text>
    <text x="16" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">LIVE AUTOMATION</text>
    <circle cx="145" cy="30" r="12" fill="#00FF87" />
    <polygon points="142,26 142,34 149,30" fill="#37003C" />
  </g>

  <!-- Geometric accent diamonds -->
  <polygon points="280,100 290,110 280,120 270,110" fill="#E7FF00" opacity="0.8" />
  <polygon points="490,460 505,475 490,490 475,475" fill="#00D9FF" opacity="0.8" />
  <polygon points="140,110 150,120 140,130 130,120" fill="#00FF87" opacity="0.8" />
</svg>
