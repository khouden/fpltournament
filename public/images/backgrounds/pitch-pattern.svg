<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b381e"/>
      <stop offset="100%" stop-color="#062413"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#grassGrad)"/>
  <!-- Pitch Markings -->
  <rect x="20" y="20" width="360" height="560" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <!-- Halfway line -->
  <line x1="20" y1="300" x2="380" y2="300" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Center circle -->
  <circle cx="200" cy="300" r="50" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <circle cx="200" cy="300" r="3" fill="#00FF87" fill-opacity="0.5"/>
  <!-- Penalty box top -->
  <rect x="110" y="20" width="180" height="90" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <!-- 6 yard box top -->
  <rect x="150" y="20" width="100" height="35" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <!-- Penalty box bottom -->
  <rect x="110" y="490" width="180" height="90" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <!-- 6 yard box bottom -->
  <rect x="150" y="545" width="100" height="35" stroke="#00FF87" stroke-width="2" stroke-opacity="0.35" fill="none"/>
</svg>
